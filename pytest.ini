[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --cov=db.mst_actress_repository
    --cov=db.trn_dmm_items_repository
    --cov=dmm.dmm_actress_api
    --cov=run
    --cov=scripts.collect._filter
    --cov=scripts.process.backfill_tachiyomi
    --cov=scripts.process.enrich_actress
    --cov=scripts.process.create_actress_review
    --cov=utils.get_tachiyomi
    --cov=utils.run_lock
    --cov=utils.supabase_retry
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-fail-under=100
